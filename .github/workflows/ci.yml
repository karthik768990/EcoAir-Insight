name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ecoair_user
          POSTGRES_PASSWORD: ecoair_password
          POSTGRES_DB: ecoair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest httpx

    - name: Run Pytest
      env:
        DATABASE_URL: postgresql://ecoair_user:ecoair_password@localhost:5432/ecoair_test
        GEMINI_API_KEY: dummy_key
      run: |
        cd backend
        PYTHONPATH=.. pytest tests/
